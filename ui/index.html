<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Ask My Work</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#f7f7f8}main{background:white;padding:28px;border-radius:16px}textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{padding:11px 18px;border:0;border-radius:8px;cursor:pointer}.answer{white-space:pre-wrap;margin-top:20px;padding:16px;background:#f1f1f1;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Ask My Work</h1><p>Local-first AI work memory · v0.1 · read-only</p><div class='grid'><section><h2>Save a note</h2><input id='title' placeholder='Title'><textarea id='content' rows='7' placeholder='What did you learn or fix?'></textarea><button onclick='note()'>Save Note</button></section><section><h2>Ask</h2><textarea id='q' rows='7' placeholder='How did I fix the Redis problem?'></textarea><button onclick='ask()'>Ask My Work</button><div id='answer' class='answer'></div></section></div></main><script>async function note(){let r=await fetch('/api/v1/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,content:content.value})});alert(r.ok?'Note saved':'Failed');}async function ask(){answer.textContent='Thinking...';let r=await fetch('/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});let d=await r.json();answer.textContent=d.answer||JSON.stringify(d);}</script></body></html>
