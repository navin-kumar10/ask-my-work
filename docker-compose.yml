services:
  api:
    build: .
    container_name: ask-my-work-api
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/data"]
    depends_on: [qdrant, ollama]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ask-my-work-qdrant
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    container_name: ask-my-work-ollama
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped
volumes:
  qdrant_data:
  ollama_data:
