services:
  api:
    build: ./api
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: qwen3:4b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ask_my_work
      SQLITE_PATH: /app/data/ask_my_work.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  qdrant_data:
